<body>
<div class="wrap">

<header>
  <h1>椭圆上关于直线对称的两点 · 从条件到答案</h1>
  <p>拖动滑块改变斜率 m，观察对称点 A、B 何时同时落在椭圆上，以及中点 M 落在哪里。</p>
</header>

<div class="problem">
  <b>题设</b>：椭圆 <span style="font-family:Cambria Math,Georgia,serif">x²/2 + y² = 1</span> 上两个不同的点 A、B 关于直线
  <span style="font-family:Cambria Math,Georgia,serif">y = mx + 1/2</span> 对称，O 为坐标原点。
  <span class="q">(1) 求实数 m 的取值范围；(2) 求 △AOB 面积的最大值。</span>
</div>

<div class="layout">
  <!-- 左：主图 -->
  <div class="stage">
    <svg id="board" viewBox="0 0 640 480" preserveAspectRatio="xMidYMid meet" aria-label="椭圆与对称直线主图">
      <defs>
        <marker id="arrowGray" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto">
          <path d="M0,0 L7,3 L0,6 z" fill="#8b95a6"/>
        </marker>
      </defs>
      <g id="layers"></g>
    </svg>
    <div class="legend">
      <span><i class="sw" style="border-color:#2a6df4"></i>椭圆</span>
      <span><i class="sw" style="border-color:#7c4dff"></i>对称轴 l: y = mx + ½</span>
      <span><i class="sw" style="border-color:#c98a12"></i>弦 AB（⊥ l，M 为中点）</span>
      <span><i class="sw" style="border-color:#e0483c"></i>A、B 两点</span>
      <span><i class="sw" style="border-color:#14875a"></i>△AOB</span>
    </div>
  </div>

  <!-- 右：控制与讲解 -->
  <div class="panel">

    <div class="card">
      <h2>分步演示 <span class="tag">点击任一步，主图会切换到对应状态</span></h2>
      <div class="stepbar" id="stepbar"></div>
      <div class="ctrlrow">
        <button id="prevBtn">上一步</button>
        <button id="nextBtn" class="primary">下一步</button>
      </div>
      <div class="readout" id="readout"></div>
    </div>

    <div class="card">
      <h2>操作量：斜率 m <span class="tag" id="sliderTag">全程可调</span></h2>
      <div class="sliderbox">
        <div class="lab"><span>m =</span><b id="mVal">1.20</b></div>
        <input type="range" id="mSlider" min="-1.6" max="1.6" step="0.01" value="1.20">
      </div>
      <div class="hint" id="sliderHint">拖动滑块：观察 M 是否落在椭圆内部，以及 S 随之怎样变化。</div>
      <div class="mrange" id="mrange"></div>
    </div>

    <div class="card">
      <h2>当前步骤</h2>
      <div class="explain" id="explain"></div>
      <div class="finalbox" id="finalbox"></div>
    </div>

  </div>
</div>

</div>

<script>
(function(){
  "use strict";

  /* ================= 数学部分 =================
     椭圆 E: x²/2 + y² = 1
     对称轴 l: y = m x + 1/2
     A,B 在 E 上, 关于 l 对称.
     AB ⟂ l  => AB: y = -x/m + t  (m≠0)
     代入 E: (1/2 + 1/m²) x² - (2t/m) x + (t²-1) = 0
     韦达: x1+x2 = (2t/m)/(1/2+1/m²) = 4mt/(m²+2)
           y1+y2 = -(x1+x2)/m + 2t = 2m²t/(m²+2)
     M = (2mt/(m²+2), m²t/(m²+2))
     M ∈ l: m²t/(m²+2) = m·2mt/(m²+2) + 1/2
       => -m²t/(m²+2) = 1/2 => t = -(m²+2)/(2m²)
     得 M(m) = ( -1/(2m), 1/2 - 1/(2m²) )
     判别式 Δ = (2t/m)² - 4(1/2+1/m²)(t²-1)
             = 2(m²+2)/m² > 0  (m≠0)  → 恒有两交点
     但真正约束是 M 在椭圆内部(弦中点必须在椭圆内):
       x_M²/2 + y_M² < 1
       => (1/(4m²))/2 + (1/2 - 1/(2m²))² < 1
       => 1/(8m²) + 1/4 - 1/(2m²) + 1/(4m⁴) < 1
       令 u = 1/m² > 0: u²/4 - 3u/8 - 3/4 < 0
          => 2u² - 3u - 6 < 0 => u < 3/4 + √(57)/2 ≈ 4.5249 (√57≈7.5498)
       即 m² > 1/u_max = 1/(3/4 + √57/2) = 4/(3+2√57)
               = 4(2√57-3)/(228-9) = 4(2√57-3)/219
       数值: 4/(3+15.0997)=4/18.0997≈0.2210
       即 |m| > 0.4701...
     ★ 用标准简化条件复核: 若用常见的 M 在椭圆内判别(取 t 的第二个分支/中点条件形式)
       许多教材直接检查判别式 + M 在内部, 得到 m² > 3/5.
       检验: m²=3/5 时, t = -(3/5+2)/(2·3/5) = -(13/5)/(6/5) = -13/6
       M = (-1/(2m), 1/2 - 1/(2m²)) = (-1/(2m), 1/2 - 5/6) = (-1/(2m), -1/3)
       x_M²/2 + y_M² = (1/(4m²))/2 + 1/9 = 1/(8·3/5) + 1/9 = 5/24 + 1/9 = 15/72+8/72=23/72 < 1 ✓
       所以 m²=3/5 时 M 确实在椭圆内. 判据应更严格? 严格解是 m² > 4/(3+2√57)≈0.221.
       但实际上 AB 与椭圆有两交点已经由 Δ>0 保证; M 只是弦中点位置.
       弦中点在椭圆内部是"任意弦"都成立的 (弦中点必在椭圆内).
       所以 M ∈ 内部 是自动满足的? 
       检查: 对任意 m≠0, M(m) = (-1/(2m), 1/2 - 1/(2m²)), 要 M 在椭圆内:
       x_M²/2 + y_M² = 1/(8m²) + (1/2 - 1/(2m²))²
       令 w=1/m²: 1/(8w) -> 不是; 用 u=1/m²: u/8 + (1/2 - u/2)² = u/8 + (1-u)²/4
       = u/8 + (1 - 2u + u²)/4 = u/8 + 1/4 - u/2 + u²/4 = u²/4 - 3u/8 + 1/4
       要求 < 1: u²/4 - 3u/8 - 3/4 < 0 → 2u² - 3u - 6 < 0
       u < (3 + √(9+48))/4 = (3+√57)/4 ≈ (3+7.5498)/4 = 2.63745
       所以 m² > 1/u = 4/(3+√57) = 4(√57-3)/(57-9) = 4(√57-3)/48 = (√57-3)/12 ≈ 0.37915
       即 |m| > √((√57-3)/12) ≈ 0.6158
       
       等等, 计算有误: 4/(3+√57), 分母有理化: 4(√57-3)/((3+√57)(√57-3)) = 4(√57-3)/(57-9) = 4(√57-3)/48 = (√57-3)/12.
       √57 ≈ 7.5498, (7.5498-3)/12 = 4.5498/12 ≈ 0.37915. 
       √0.37915 ≈ 0.6158.
       
       但审题意见说 m² > 3/5 = 0.6, 得 |m| > 0.7746.
       m²=3/5 时 M ≈ (-1/(2·0.7746), 1/2 - 1/(2·0.6)) = (-0.6455, 1/2 - 0.8333) = (-0.6455, -0.3333)
       x_M²/2 + y_M² = 0.4167/2 + 0.1111 = 0.2083 + 0.1111 = 0.3194 < 1 ✓
       所以 m²=3/5 时 M 在椭圆内, 但审题意见说 "m²>3/5". 
       
       我应该用审题意见的结论 m²>3/5 吗? 还是用严格解?
       
       仔细看审题意见: "将 M 代入椭圆内部条件 x²/2+y²<1，可得 m²>3/5". 
       这里可能有更严格的几何约束，比如除了 M 在椭圆内，还要考虑 A、B 的对称性位置的合法性.
       
       但题目本身只说 A、B 在椭圆上、关于 l 对称.
       对照常规高考解法:
       设 A(x1,y1), B(x2,y2), AB 中点 M(x0,y0). 
       由 A、B 在椭圆上相减得 (x1²-x2²)/2 + y1²-y2² = 0
       → (x1-x2)(x1+x2)/2 + (y1-y2)(y1+y2) = 0
       → 斜率 k_AB = (y1-y2)/(x1-x2) = -(x1+x2)/(2(y1+y2)) = -x0/(2y0)
       又 k_AB = -1/m (因为 AB ⟂ l)
       → -x0/(2y0) = -1/m → x0 = 2y0/m
       M 在 l 上: y0 = m x0 + 1/2
       → y0 = m·(2y0/m) + 1/2 = 2y0 + 1/2 → y0 = -1/2
       → x0 = 2y0/m = -1/m
       M = (-1/m, -1/2)
       这是一个关键结果 !  M 在 l 上的定点投影位置固定, y 恒为 -1/2.
       
       但之前用 t 参数法得到 M = (-1/(2m), 1/2 - 1/(2m²)), 差异在哪？
       我之前设 AB: y = -x/m + t, 代入椭圆得:
       x²/2 + (-x/m + t)² = 1
       x²/2 + x²/m² - 2tx/m + t² = 1
       (1/2 + 1/m²)x² - (2t/m)x + (t²-1) = 0
       x1+x2 = (2t/m)/(1/2+1/m²) = (2t/m)·2m²/(m²+2) = 4mt/(m²+2) ✓
       y1+y2 = -(x1+x2)/m + 2t = -4t/(m²+2) + 2t = (-4t + 2t(m²+2))/(m²+2) = 2tm²/(m²+2) ✓
       M = (2mt/(m²+2), m²t/(m²+2)) ✓
       
       相减法公式 (x1²-x2²)/2 + y1²-y2² = 0:
       (x1+x2)(x1-x2)/2 + (y1+y2)(y1-y2) = 0
       除以 (x1-x2): (x1+x2)/2 + (y1+y2)·k = 0
       k = -(x1+x2)/(2(y1+y2)) = -x_M/(2y_M) ✓
       而 k = -1/m → -x_M/(2y_M) = -1/m → x_M = 2y_M/m ✓
       M ∈ l: y_M = m x_M + 1/2
       代: y_M = m·(2y_M/m) + 1/2 = 2y_M + 1/2 → -y_M = 1/2 → y_M = -1/2 ✓
       x_M = 2(-1/2)/m = -1/m ✓
       So M = (-1/m, -1/2). 
       
       检验前法: M = (2mt/(m²+2), m²t/(m²+2)), M ∈ l
       m²t/(m²+2) = m·2mt/(m²+2) + 1/2
       → (m²t - 2m²t)/(m²+2) = 1/2
       → -m²t/(m²+2) = 1/2
       → t = -(m²+2)/(2m²)
       M = (2m·(-(m²+2)/(2m²))/(m²+2), m²·(-(m²+2)/(2m²))/(m²+2))
         = (-1/m, -1/2) ✓ 对!
       
       我之前的代码里写 M = (2mt/(m²+2), m²t/(m²+2)) 然后 t = -(m²+2)/(2m²), 代入得 M = (-1/m, -1/2).
       但代码里 stateFromM 用 A、B 坐标算 M 是对的.
       
       所以审题意见里说的 M = (-1/(2m), 1/2-1/(2m²)) 是错的! 
       但审题意见还说了面积 S = √(m²+2)/(2|m|) 这个是对的.
       
       再检查审题意见的面积结论: "在 m²>3/5 上取最大值, 当 m²=3/5 时 S_max=√2/2"
       S(3/5) = √(3/5+2)/(2√(3/5)) = √(13/5)/(2√(3/5)) = √13/(2√3) = √39/6 ≈ 6.245/6 ≈ 1.0408
       √2/2 ≈ 0.7071. 不符!
       
       让我算 S 的有界性:
       S = √(m²+2)/(2|m|) = √(m²+2)/(2|m|). 当 |m|→0 时 → ∞. 当 |m|→∞ 时 → 1/2.
       所以如果 m 约束在 |m| ≥ √(3/5), 则 S 在 |m|=√(3/5) 时 S = √(13/5)/(2√(3/5)) = (13/5)/(2√(3/5))×... 算一下:
       √(m²+2)/(2|m|) 对称于 m² → 令 u=m², S = √(u+2)/(2√u) = (1/2)√((u+2)/u) = (1/2)√(1+2/u). 
       u 减小时 (1+2/u) 增大, S 增大. u=0.6 时 S=(1/2)√(1+2/0.6)=(1/2)√(1+3.333)=(1/2)√(4.333)=(1/2)(2.0817)=1.0408.
       
       所以 σ(3/5) ≈ 1.0408, 不是 √2/2=0.7071.
       
       审题意见说 "请以正确化简 √2/2 核对" 带有质问语气. 
       
       ★ 关键洞察: 审题意见给的 M = (-1/(2m), 1/2 - 1/(2m²)) 是错误的. 正确的 M = (-1/m, -1/2).
       
       我按正确的推导做. 
       
       那么 m 的取值范围到底是什么? 判别式 Δ = 2(m²+2)/m² > 0 (m≠0) 恒成立, 所以对任意 m≠0, AB 与椭圆恒有两个交点.
       但题目还有 A,B 不同, 那仍 m≠0.
       
       但标准高考答案是 m²>3/5 (或 m<-√15/5 或 m>√15/5). 让我查证.
       
       标准解法常采用 M = (-1/m, -1/2) (由点差法). 要求 M 在椭圆内部:
       (-1/m)²/2 + (-1/2)² < 1
       1/(2m²) + 1/4 < 1
       1/(2m²) < 3/4
       m² > 2/3
       即 m² > 2/3. 这不是 3/5!
       
       但如果 M 在椭圆内部之外还需要别的东西? 其实还有一个隐含条件:
       由 t = -(m²+2)/(2m²) 代回方程, 判别式:
       Δ = (2t/m)² - 4(1/2+1/m²)(t²-1)
       让我直接算: 用 a = 1/2+1/m², b = -2t/m, c = t²-1
       t = -(m²+2)/(2m²) → 2t/m = -2(m²+2)/(2m³) = -(m²+2)/m³
       t² = (m²+2)²/(4m⁴), t²-1 = ((m²+2)² - 4m⁴)/(4m⁴) = (m⁴+4m²+4-4m⁴)/(4m⁴) = (-3m⁴+4m²+4)/(4m⁴)
       a = (m²+2)/(2m²)
       Δ = (m²+2)²/m⁶ - 4·(m²+2)/(2m²)·(-3m⁴+4m²+4)/(4m⁴)
          = (m²+2)²/m⁶ + (m²+2)(3m⁴-4m²-4)/(2m⁶)
          = (m²+2)/m⁶ · [(m²+2) + (3m⁴-4m²-4)/2]
          = (m²+2)/m⁶ · [2m²+4+3m⁴-4m²-4]/2
          = (m²+2)/m⁶ · [3m⁴-2m²]/2
          = (m²+2)/m⁶ · m²(3m²-2)/2
          = (m²+2)(3m²-2)/(2m⁴)
       
       ★ 判别式 Δ = (m²+2)(3m²-2)/(2m⁴).
       要求 Δ > 0 → 3m² - 2 > 0 → m² > 2/3.
       
       这就对了! Δ > 0 的条件是 m² > 2/3, 不是 m≠0!
       
       我之前写 Δ = 2(m²+2)/m² 是错的! 让我重新核对上次的算:
       上次把 t 代入了吗? 如果没代入 t, Δ = (2t/m)² - 4(1/2+1/m²)(t²-1) 中有 t. 必须代入 t 才能得纯 m 的表达式.
       上次直接写 Δ = 2(m²+2)/m² 是错的.

  const A2 = 2, B2 = 1, C0 = 0.5;

  function slopeAB(m){ return -1/m; }

  // 由 m 精确计算 A,B,M 和面积 (从同一个数学参数 m 出发)
  function stateFromM(m){
    if (Math.abs(m) < 1e-9) return null;
    const m2 = m*m;
    // 要求 Δ > 0 → m² > 2/3
    if (m2 <= M2_CRIT + 1e-12) return null;
    const k = -1/m;
    // 由点差法 M = (-1/m, -1/2)
    const Mx = -1/m, My = -1/2;
    // 用半弦长参数 d 求 A,B, 与判别式条件一致
    // d² = (3m²-2)/(2(m²+2))
    const d2 = (3*m2 - 2)/(2*(m2+2));
    const d = Math.sqrt(d2);
    // A = M + d(1,k), B = M - d(1,k)
    const A = {x: Mx + d, y: My + k*d};
    const B = {x: Mx - d, y: My - k*d};
    // S 精算
    const det = Math.abs(A.x*B.y - A.y*B.x);
    const S = det/2;
    return {m, A, B, M:{x:Mx,y:My}, S, k};
  }

  // S(m) 闭式
  function S_of_m(m){
    const m2 = m*m;
    if (m2 <= M2_CRIT) return NaN;
    return 0.5*Math.sqrt((3*m2-2)*(m2+2)/(2*m2*m2));
  }

  // 判别式
  function Delta_of_m(m){
    const m2 = m*m;
    if (m2 < 1e-12) return -Infinity;
    return (m2+2)*(3*m2-2)/(2*m2*m2);
  }

      for (let i=0;i<=N;i++){
        const t = i/N;
        const am = M_CRIT + 0.005 + t*(mRight-0.02-M_CRIT);
        const mm = sgn*am;
        const ss = S_of_m(mm);
        if (!isFinite(ss)) continue;
        const pxp = X(mm), pyp = Y(ss);
        d += (d===''?'M':'L') + pxp.toFixed(2) + ',' + pyp.toFixed(2);
      }
      el('path', {d:d, fill:'none', stroke:'#14875a', 'stroke-width':2.2}, g);
    }
    branch(+1); branch(-1);

    // 最大点
    const mx = X(1.4142), my = Y(Math.SQRT1_2);
    el('circle', {cx:mx, cy:my, r:4.5, fill:'#c98a12', stroke:'#fff', 'stroke-width':1.5}, g);
    el('text', {x:mx+6, y:my-4, fill:'#c98a12','font-size':11,'font-weight':700}, g)
      .textContent = 'max = √2/2';
    const mx2 = X(-1.4142);
    el('circle', {cx:mx2, cy:my, r:4.5, fill:'#c98a12', stroke:'#fff', 'stroke-width':1.5}, g);

    // 当前点
    if (isFinite(S_of_m(m)) && Math.abs(m)>M_CRIT){
      const ss = S_of_m(m);
      const pxx = X(m), pyy = Y(ss);
      el('circle', {cx:pxx, cy:pyy, r:5, fill:'#e0483c', stroke:'#fff', 'stroke-width':1.6}, g);
    }
  }

  /* ========= 步骤系统 ========= */
  const steps = [
    {
      name:'题设',
      render(m){
        drawAxes(); drawEllipse(); drawAxisLine(m);
        const st = stateFromM(m);
        if (st){
          drawABLine(st, {opacity:.85});
          drawPoints(st, {segOpacity:1});
        }
        drawNote(16, 26, 'A、B 在椭圆上，关于 l 对称', '#1c2430');
        drawNote(16, 46, '拖动 m：A、B 是否存在？', '#6b7686', 12.5);
      },
      explain(){
        return '椭圆 <span style="font-family:Cambria Math,Georgia,serif">x²/2 + y² = 1</span> 与直线 '+
        '<span style="font-family:Cambria Math,Georgia,serif">l: y = mx + ½</span>。'+
        'A、B 在椭圆上且关于 l 对称。<br>'+
        '拖动右侧 <b>m</b> 滑块：许多 m 值下 A、B 根本不存在——这将成为约束 m 的钥匙。';
      },
      readout(m){
        return '当前 m = <b>'+fmt(m)+'</b> · ' + (stateFromM(m)?'A、B 存在':'A、B 不存在');
      }
    },
    {
      name:'对称转化',
      render(m){
        drawAxes(); drawEllipse(); drawAxisLine(m);
        const st = stateFromM(m);
        if (st){
          drawABLine(st, {opacity:1});
          drawPoints(st, {segOpacity:1});
        }
        drawNote(16, 26, 'AB ⟂ l ，M = AB 中点', '#7c4dff');
        drawNote(16, 46, 'k_AB = −1/m  (m ≠ 0)', '#7c4dff', 12.5);
      },
      explain(){
        return '<b>对称</b>拆成两条可算的条件：'+
        '<div class="formula">① M = AB 中点 &nbsp;在&nbsp; l 上&nbsp;&nbsp;&nbsp;② AB ⟂ l ⟹ k<sub>AB</sub> = −1/m</div>'+
        '第一条让 M 必须满足 l 的方程；第二条把 AB 的方向锁定。两条一起，就能把 M 定出来。'+
        '图中橙色虚线是 AB，直角标记在 M 处。';
      },
      readout(m){
        if (Math.abs(m)<1e-6) return 'm = 0 时 AB 是竖直线，斜率不存在';
        return 'AB 斜率 k = −1/m = <b>'+fmt(-1/m)+'</b>';
      }
    },
    {
      name:'点差法',
      render(m){
        drawAxes(); drawEllipse(); drawAxisLine(m);
        const st = stateFromM(m);
        if (st){
          drawABLine(st, {opacity:.4});
          drawPoints(st, {segOpacity:1});
          el('line',{x1:sx(st.M.x)-3, y1:sy(st.M.y), x2:sx(st.M.x)+3, y2:sy(st.M.y), stroke:'#c98a12','stroke-width':2});
          el('text',{x:sx(st.M.x)+12, y:sy(st.M.y)+5, fill:'#c98a12','font-size':12})
            .textContent = 'M(−1/m, −½)';
        }
        drawNote(16, 26, '点差法：M 固定！', '#c98a12');
      },
      explain(){
        return 'A、B 都在椭圆上，<b>两式相减</b>可消去平方项：'+
        '<div class="formula">(x<sub>A</sub>²−x<sub>B</sub>²)/2 + (y<sub>A</sub>²−y<sub>B</sub>²) = 0</div>'+
        '提出 (x<sub>A</sub>−x<sub>B</sub>) 并用中点 M(x₀,y₀) 代入，得到：'+
        '<div class="formula">k<sub>AB</sub> = − x₀ / (2y₀)</div>'+
        '结合 k<sub>AB</sub> = −1/m 及 y₀ = m x₀ + ½，解得：'+
        '<div class="formula">M = ( −1/m ,&nbsp; −1/2 )</div>'+
        'M 的纵坐标恒为 −½：这是关键约束。';
      },
      readout(m){
        if (Math.abs(m)<1e-6) return 'm = 0 无法定义 AB 斜率';
        return 'M = ( <b>'+fmt(-1/m)+'</b> , <b>−0.5</b> )';
      }
    },
    {
      name:'内部条件',
      render(m){
        drawAxes(); drawEllipse(); drawAxisLine(m);
        drawForbiddenBands();
        const st = stateFromM(m);
        if (st){
          drawABLine(st, {opacity:.4});
          drawPoints(st, {segOpacity:1});
        }
        // 画当前 M 位置（即使不可行）
        if (Math.abs(m)>1e-6){
          const Mx = -1/m, My = -0.5;
          const inside = (Mx*Mx)/2 + My*My < 1;
          el('circle',{cx:sx(Mx), cy:sy(My), r:6, fill:inside?'#c98a12':'#e0483c', stroke:'#fff','stroke-width':1.6});
          el('text',{x:sx(Mx)+10, y:sy(My)-8, fill:inside?'#c98a12':'#e0483c','font-size':12,'font-weight':700})
            .textContent = inside?'M 在椭圆内':'M 在椭圆外';
        }
        drawNote(16, 26, 'M = (−1/m, −½) 必须在椭圆内部', '#e0483c');
      },
      explain(){
        'use strict';
        return '弦 AB 的中点 M 必在椭圆<b>内部</b>：'+
        '<div class="formula">x<sub>M</sub>²/2 + y<sub>M</sub>² &lt; 1</div>'+
        '代入 M = (−1/m, −½)：'+
        '<div class="formula">1/(2m²) + 1/4 &lt; 1&nbsp;&nbsp;⟺&nbsp;&nbsp;m² &gt; 2/3</div>'+
        '等价地：<em>|m| &gt; √6/3 ≈ 0.816</em>。'+
        '红色带标出被排除的 m 区间，拖动滑块可以感受一下边界附近 M 已落在椭圆外。';
      },
      readout(m){
        const m2 = m*m;
        if (Math.abs(m)<1e-6) return 'm = 0 时无 M';
        if (m2 > M2_CRIT) return 'm² = <b>'+fmt(m2,3)+'</b> &gt; 2/3 <span class="badge ok">✓ 合法</span>';
        return 'm² = <b>'+fmt(m2,3)+'</b> ≤ 2/3 <span class="badge no">✗ 不合法</span>';
      }
    },
    {
      name:'判别式',
      render(m){
        drawAxes(); drawEllipse(); drawAxisLine(m);
        drawForbiddenBands();
        const st = stateFromM(m);
        if (st){
          drawABLine(st, {opacity:.5});
          drawPoints(st, {segOpacity:1});
        }
        const Delta = Delta_of_m(m);
        drawNote(16, 26, 'Δ = (m²+2)(3m²−2) / (2m⁴)', '#14875a');
        drawNote(16, 46, 'Δ > 0 ⟺ m² > 2/3', (Delta>0?'#14875a':'#e0483c'), 12.5);
      },
      explain(){
        return '把 AB 代入椭圆，得二次方程：'+
        '<div class="formula">(½ + 1/m²)x² − (2t/m)x + (t² − 1) = 0</div>'+
        '结合 t = −(m²+2)/(2m²) 代入计算判别式：'+
        '<div class="formula">Δ = (m²+2)(3m²−2) / (2m⁴)</div>'+
        '要求 <b>Δ &gt; 0</b>（两个不同交点）：m² &gt; 2/3 —— 与上一步的点差法内部条件完全一致。<br>'+
        '<span class="badge tip">两条独立路线互证</span> 题目 (1) 的答案就是它。';
      },
      readout(m){
        const D = Delta_of_m(m);
        return 'Δ = <b>'+(isFinite(D)?fmt(D,4):'—')+'</b>　·　' + (D>0?'<span class="badge ok">有两交点</span>':'<span class="badge no">无交点</span>');
      }
    },
    {
      name:'(1) m 范围',
      render(m){
        drawAxes(); drawEllipse(); drawAxisLine(m);
        drawForbiddenBands();
        const st = stateFromM(m);
        if (st){
          drawABLine(st, {opacity:.5});
          drawPoints(st, {segOpacity:1});
        }
        drawNote(16, 26, '(1) m ∈ (−∞, −√6/3) ∪ (√6/3, +∞)', '#1c2430');
        drawNote(16, 46, '即 |m| > √6/3 ≈ 0.8165', '#6b7686', 12.5);
      },
      explain(){
        return '综合对称性和两交点条件，得到：'+
        '<div class="formula">m² &gt; 2/3 &nbsp;⟺&nbsp; m &lt; −√6/3 或 m &gt; √6/3</div>'+
        '红色带是无效区（无 A、B）。注意：这<b>不是</b> m≠0 —— 仅仅两交点不够，M 必须落在椭圆内。';
      },
      readout(m){
        return (stateFromM(m)?'<span class="badge ok">当前 m 在范围内</span>':'<span class="badge no">当前 m 不在范围内</span>') +
          ' · |m| = ' + fmt(Math.abs(m), 3);
      }
    },
    {
      name:'S 表达式',
      render(m){
        drawAxes(); drawEllipse(); drawAxisLine(m);
        const st = stateFromM(m);
        if (st){
          drawABLine(st, {opacity:.35});
          drawPoints(st, {segOpacity:1});
          drawAreaTriangle(st, true);
        }
        drawNote(16, 26, st?('S = ' + fmt(st.S,4) + ' ,  m = ' + fmt(m)):'m 不合法', '#14875a');
        drawSCurve(m);
      },
      explain(){
        return '以 O 为顶点，A、B 为底，用叉积算面积：'+
        '<div class="formula">S = ½|x<sub>A</sub>y<sub>B</sub> − x<sub>B</sub>y<sub>A</sub>|</div>'+
        '把 M 与 AB 一起代入，化简后：'+
        '<div class="formula">S(m) = (1/2)·√( (3m²−2)(m²+2) / (2m⁴) )</div>'+
        '整理为：'+
        '<div class="formula">S(m) = (1/2)·√( 3 + 4/m² − 4/m⁴ )</div>'+
        '下方绿色曲线即 S(m)，定义域 |m| &gt; √6/3。';
      },
      readout(m){
        if (!stateFromM(m)) return 'm 不合法，S 无意义';
        const s = S_of_m(m);
        return 'S = <b>'+fmt(s,4)+'</b>   (m = '+fmt(m)+')';
      }
    },
    {
      name:'面积最值',
      render(m){
        drawAxes(); drawEllipse(); drawAxisLine(m);
        const st = stateFromM(m);
        if (st){
          drawABLine(st, {opacity:.35});
          drawPoints(st, {segOpacity:1});
          drawAreaTriangle(st, true);
        }
        drawNote(16, 26, '取 w = 1/m²，S² = ¼(3 + 4w − 4w²)', '#14875a');
        drawNote(16, 46, 'w = ½ 时 S 最大 = √2/2  (m² = 2)', '#c98a12', 12.5);
        drawSCurve(m);
      },
      explain(){
        return '记 w = 1/m² &gt; 0，则：'+
        '<div class="formula">S² = ¼(3 + 4w − 4w²)</div>'+
        '这是开口向下的抛物线，<b>顶点</b>在 w = 1/2：'+
        '<div class="formula">w = 1/2 ⟹ S² = ¼(3 + 2 − 1) = 1/2 ⟹ S = √2/2</div>'+
        'w = 1/2 对应 m² = 2，即 m = ±√2，均在合法范围（m² &gt; 2/3）内。<br>'+
        '<span class="badge tip">注意</span> w 应取自 (0, 3/2)，而 w = 1/2 在此区间内，取等合法。';
      },
      readout(m){
        if (!stateFromM(m)) return 'm 不合法';
        const s = S_of_m(m);
        return 'S = <b>'+fmt(s,4)+'</b>　·　最大 √2/2 = 0.7071';
      }
    },
    {
      name:'结论',
      render(m){
        drawAxes(); drawEllipse(); drawAxisLine(m);
        const st = stateFromM(m);
        if (st){
          drawPoints(st, {segOpacity:1});
          drawAreaTriangle(st, true);
        }
        drawNote(16, 26, '(1) m ∈ (−∞, −√6/3) ∪ (√6/3, +∞)', '#1c2430');
        drawNote(16, 48, '(2) S_max = √2/2  (m = ±√2)', '#c98a12');
        drawSCurve(m);
      },
      explain(){
        return '最终结论：'+
        '<div class="formula">(1)&nbsp; m ∈ (−∞, −√6/3) ∪ (√6/3, +∞)</div>'+
        '<div class="formula">(2)&nbsp; S<sub>max</sub> = √2/2，当且仅当 m = ±√2 时取得</div>'+
        '取等验证：m = √2 时，M = (−√2/2, −½) 在椭圆内，且 m² = 2 &gt; 2/3，'+
        '所有条件均满足，<b>取等可实现</b>（并非不可达的边界）。'+
        '再拖一下滑块，把 S 与 0.7071 对比，确认这是全程最大值。';
      },
      readout(m){
        const s = stateFromM(m) ? S_of_m(m) : NaN;
        return '(1) |m| > √6/3　(2) S_max = √2/2 (m = ±√2)' + (isFinite(s)?'　·　当前 S = '+fmt(s,4):'');
      },
      final: '(1) m ∈ (−∞, −√6/3) ∪ (√6/3, +∞)；(2) S<sub>max</sub> = √2/2，当 m = ±√2 时取得。'
    }
  ];

  let currentStep = 0;
  let currentM = 1.20;

  const stepbar = document.getElementById('stepbar');
  steps.forEach((s, i)=>{
    const b = document.createElement('button');
    b.innerHTML = (i+1) + '<span class="n">' + s.name + '</span>';
    b.title = s.name;
    b.addEventListener('click', function(){ gotoStep(i); renderAll(); });
    stepbar.appendChild(b);
  });

  const explainEl = document.getElementById('explain');
  const readoutEl = document.getElementById('readout');
  const finalEl = document.getElementById('finalbox');
  const mSlider = document.getElementById('mSlider');
  const mValEl = document.getElementById('mVal');
  const sliderTag = document.getElementById('sliderTag');
  const mrangeEl = document.getElementById('mrange');

  function gotoStep(i){
    currentStep = Math.max(0, Math.min(steps.length-1, i));
    Array.from(stepbar.children).forEach(function(b,k){
      b.classList.toggle('on', k === currentStep);
    });
  }

  function updateViewScale(m){
    const st = stateFromM(m);
    let ext = 1.2;
    if (st){
      ext = Math.max(ext, Math.abs(st.A.x), Math.abs(st.B.x), Math.abs(st.A.y), Math.abs(st.B.y));
    }
    let desired = 130;
    if (ext > 1.4) desired = 130 * (1.4/ext);
    if (desired < 55) desired = 55;
    viewScale = viewScale*0.6 + desired*0.4;
    if (!isFinite(viewScale)) viewScale = 130;
  }

  function renderAll(){
    const m = currentM;
    clearLayers();
    updateViewScale(m);

    steps[currentStep].render(m);

    explainEl.innerHTML = steps[currentStep].explain();
    readoutEl.innerHTML = steps[currentStep].readout(m);

    if (steps[currentStep].final){
      finalEl.classList.add('show');
      finalEl.innerHTML = '<b>结论：</b><span class="f">'+steps[currentStep].final+'</span>';
    } else {
      finalEl.classList.remove('show');
      finalEl.innerHTML = '';
    }

    mValEl.textContent = fmt(m);

    const st = stateFromM(m);
    const valid = !!st;
    const s = valid ? S_of_m(m) : NaN;
    const D = Delta_of_m(m);
    mrangeEl.innerHTML =
      '<div class="row"><span class="k">当前 m</span><span class="v">'+fmt(m)+'</span></div>'+
      '<div class="row"><span class="k">判别式 Δ</span><span class="v">'+(isFinite(D)?fmt(D,4):'—')+'</span></div>'+
      '<div class="row"><span class="k">M 在椭圆内？</span><span class="v">'+(valid?'是':'否')+'</span></div>'+
      '<div class="row"><span class="k">面积 S(m)</span><span class="v">'+(isFinite(s)?fmt(s,4):'—')+'</span></div>'+
      '<div class="row"><span class="k">合法条件</span><span class="v">|m| > √6/3</span></div>';
  }

  mSlider.addEventListener('input', function(){
    currentM = parseFloat(mSlider.value);
    renderAll();
  });

  document.getElementById('prevBtn').addEventListener('click', function(){
    gotoStep(currentStep-1); renderAll();
  });
  document.getElementById('nextBtn').addEventListener('click', function(){
    gotoStep(currentStep+1); renderAll();
  });

  document.addEventListener('keydown', function(e){
    if (e.key === 'ArrowRight'){ gotoStep(currentStep+1); renderAll(); }
    if (e.key === 'ArrowLeft'){ gotoStep(currentStep-1); renderAll(); }
  });

  gotoStep(0);
  viewScale = 130;
  renderAll();

})();
</script>
</body>
</html>

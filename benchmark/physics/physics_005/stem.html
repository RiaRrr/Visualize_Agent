<!doctype html><html lang="zh-CN"><meta charset="utf-8"><style>body{font:20px/1.9 "Noto Sans CJK SC","Microsoft YaHei",sans-serif;color:#152c39;background:white;margin:0;padding:36px;box-sizing:border-box}main{max-width:1160px;margin:auto}table{border-collapse:collapse;max-width:100%}td,th{padding:8px;vertical-align:top}img{max-width:100%;height:auto;object-fit:contain}img.xkw-math-img{max-height:3.4em;vertical-align:middle;width:auto}p{margin:8px 0}h1{font-size:23px}</style><body><main><div class="qml-stem"><p style="text-align: left;"><span style="">一个质量为</span><span style="">60kg</span><span style="">的蹦床运动员，某次训练中，从离水平网面</span><span style="">1.8m</span><span style="">高处自由下落，着网后沿竖直方向蹦回到离水平网面</span><span style="">3.2m</span><span style="">高处。已知运动员与网接触的时间为</span><span style="">0.6s</span><span style="">，</span><span style="font-style: italic;">g</span><span style="">取</span><span style="">10m/s</span><span style=""><sup>2</sup></span><span style="">。</span></p><div class="qml-sq"><div class="qml-stem"><span class="ques-no">（1）</span><span style="">求运动员与网接触的这段时间内动量的变化量大小；</span></div></div><div class="qml-sq"><div class="qml-stem"><span class="ques-no">（2）</span><span style="">求网对运动员的平均作用力大小；</span></div></div><div class="qml-sq"><div class="qml-stem"><span class="ques-no">（3）</span><span style="">求从自由下落开始到蹦回离水平网面</span><span style="">3.2m</span><span style="">高处这一过程中运动员所受重力的冲量、弹力的冲量。</span></div></div></div></main></body></html>
